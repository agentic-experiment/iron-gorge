<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<meta name="description" content="Iron Gorge — thread the breathing canyon, drink the embers, fall deeper.">
<title>Iron Gorge</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%2308090c'/%3E%3Ccircle cx='32' cy='32' r='14' fill='%23ffcf6b'/%3E%3Ccircle cx='32' cy='32' r='23' fill='none' stroke='%23ff7a3c' stroke-width='2' opacity='.55'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{
    margin:0;height:100%;background:#08090c;overflow:hidden;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    color:#e8e2d6;-webkit-user-select:none;user-select:none;
    touch-action:none;overscroll-behavior:none;
  }
  canvas{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none}
  #ui{position:fixed;inset:0;pointer-events:none;padding:clamp(14px,3vw,30px)}
  .hud{
    display:flex;justify-content:space-between;align-items:flex-start;
    font-size:clamp(10px,1.4vw,12px);letter-spacing:.24em;color:#8f887b;
    text-transform:uppercase;
  }
  .stat{display:flex;flex-direction:column;gap:2px}
  .stat.right{text-align:right;align-items:flex-end}
  .stat .val{
    font-size:clamp(24px,3.6vw,38px);line-height:1;letter-spacing:.04em;
    color:#ffcf6b;text-shadow:0 0 22px rgba(255,130,50,.5);
  }
  .stat .sub{letter-spacing:.14em;color:#8a8073;font-size:clamp(9px,1.2vw,11px);margin-top:2px}
  .vignette{
    position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 48%,rgba(0,0,0,.62) 100%);
  }
  .vignette::after{
    content:"";position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
    opacity:.45;
  }
  .overlay{
    position:absolute;inset:0;display:grid;place-items:center;padding:24px;
    background:radial-gradient(ellipse at center,rgba(6,7,10,.30),rgba(5,5,8,.80));
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
    transition:opacity .32s ease,visibility .32s ease;
  }
  .overlay.hidden{opacity:0;visibility:hidden}
  .card{
    pointer-events:none;width:min(660px,100%);text-align:center;
    animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .eyebrow{
    font-size:clamp(9px,1.3vw,11px);letter-spacing:.42em;color:#a49a89;
    margin-bottom:clamp(14px,2.4vw,22px);text-transform:uppercase;
  }
  h1{margin:0;font-size:clamp(56px,13vw,144px);line-height:.84;letter-spacing:.02em;font-weight:800}
  h1 span{display:block}
  h1 span:first-child{
    background:linear-gradient(180deg,#fff3d6,#ffc46b 55%,#ff7a3c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 28px rgba(255,120,50,.35));
  }
  h1 .hollow{
    color:transparent;-webkit-text-stroke:1.5px rgba(255,180,110,.85);
    text-shadow:0 0 40px rgba(255,110,40,.25);
  }
  h2{
    margin:0 0 8px;font-size:clamp(40px,9vw,92px);line-height:.9;letter-spacing:.02em;
    color:transparent;-webkit-text-stroke:1.4px rgba(255,140,70,.9);
    text-shadow:0 0 46px rgba(255,90,35,.3);
  }
  .lede{color:#b7ae9f;font-size:clamp(12px,1.8vw,15px);line-height:1.7;letter-spacing:.08em;margin:clamp(18px,3vw,26px) auto 0;max-width:44ch}
  .controls{
    display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;
    margin:clamp(18px,3vw,26px) 0 0;color:#8d8577;font-size:clamp(10px,1.4vw,12px);letter-spacing:.1em;
  }
  kbd{
    display:inline-block;padding:2px 7px;margin:0 2px;border:1px solid rgba(255,200,140,.22);
    border-radius:3px;color:#d8c9ae;font:inherit;font-size:.9em;background:rgba(255,190,120,.05);
  }
  button{
    pointer-events:auto;font:inherit;text-transform:uppercase;letter-spacing:.26em;
    font-size:clamp(11px,1.5vw,13px);color:#ffcf6b;background:rgba(255,150,60,.06);
    border:1px solid rgba(255,180,100,.55);padding:15px 30px;margin-top:clamp(22px,3.6vw,30px);
    cursor:pointer;transition:background .2s,border-color .2s,box-shadow .2s,transform .2s;
    -webkit-tap-highlight-color:transparent;
  }
  button:hover,button:focus-visible{
    background:rgba(255,150,60,.14);border-color:#ffcf6b;
    box-shadow:0 0 34px rgba(255,130,50,.35);outline:none;transform:translateY(-1px);
  }
  button:active{transform:translateY(0) scale(.99)}
  .hint{margin-top:14px;color:#6f685d;font-size:clamp(9px,1.2vw,11px);letter-spacing:.2em;text-transform:uppercase}
  .results{
    display:flex;justify-content:center;gap:clamp(30px,7vw,70px);
    margin:clamp(20px,3vw,30px) 0 0;
  }
  .results>div{display:flex;flex-direction:column;gap:6px}
  .rlabel{font-size:clamp(9px,1.2vw,11px);letter-spacing:.3em;color:#8a8073}
  .results span:last-child{
    font-size:clamp(30px,5vw,50px);line-height:1;color:#ffcf6b;
    text-shadow:0 0 26px rgba(255,130,50,.45);
  }
  #runLine{color:#a49a89;letter-spacing:.16em;font-size:clamp(10px,1.4vw,12px);margin:16px 0 0}
  #mute{
    position:absolute;right:clamp(14px,3vw,30px);bottom:clamp(14px,3vw,30px);
    margin:0;padding:8px 12px;font-size:10px;letter-spacing:.2em;
    color:#b9b0a2;background:rgba(8,8,12,.5);border-color:rgba(255,200,140,.22);
    box-shadow:none;
  }
  #mute:hover{box-shadow:none}
  #mute.off{opacity:.35}
  @media (prefers-reduced-motion:reduce){
    .card{animation:none}
    .vignette::after{display:none}
  }
</style>
</head>
<body>
<canvas id="game" aria-label="Iron Gorge. Steer the bright orb through a narrowing canyon. Collect embers. Avoid the walls."></canvas>
<div class="vignette"></div>
<div id="ui">
  <div class="hud">
    <div class="stat">
      <span>Score</span>
      <span class="val" id="depth">0</span>
      <span class="sub" id="subline">0 m &middot; 0 embers</span>
    </div>
    <div class="stat right">
      <span>Best</span>
      <span class="val" id="best">0</span>
    </div>
  </div>
  <div class="overlay" id="overlay">
    <div class="card" id="menuCard">
      <div class="eyebrow">The canyon is awake</div>
      <h1><span>IRON</span><span class="hollow">GORGE</span></h1>
      <p class="lede">Thread the breathing walls. Drink the embers. Fall deeper.</p>
      <div class="controls">
        <span><kbd>A</kbd><kbd>D</kbd> / <kbd>&larr;</kbd><kbd>&rarr;</kbd> drift</span>
        <span><kbd>hold</kbd> drag to steer</span>
      </div>
      <button id="startBtn" type="button">Enter the gorge</button>
      <div class="hint">Space or tap to begin</div>
    </div>
    <div class="card" id="overCard" hidden>
      <div class="eyebrow">The gorge has fed</div>
      <h2>SWALLOWED</h2>
      <div class="results">
        <div><span class="rlabel">Score</span><span id="finalScore">0</span></div>
        <div><span class="rlabel">Best</span><span id="finalBest">0</span></div>
      </div>
      <p id="runLine">0 m &middot; 0 embers</p>
      <button id="restartBtn" type="button">Dive again</button>
      <div class="hint">Space or tap to retry</div>
    </div>
  </div>
  <button id="mute" type="button" aria-pressed="false" aria-label="Toggle sound">SND</button>
</div>
<script>
(() => {
  "use strict";

  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");
  const depthEl = document.getElementById("depth");
  const bestEl = document.getElementById("best");
  const subEl = document.getElementById("subline");
  const overlay = document.getElementById("overlay");
  const menuCard = document.getElementById("menuCard");
  const overCard = document.getElementById("overCard");
  const finalScoreEl = document.getElementById("finalScore");
  const finalBestEl = document.getElementById("finalBest");
  const runLineEl = document.getElementById("runLine");
  const muteBtn = document.getElementById("mute");

  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, DPR = 1, unit = 600;
  let bgGrad = null, wallGrad = null;
  let state = "menu";
  let t = 0, last = performance.now();
  let scroll = 0, speed = 55;
  let player = { x: 0, y: 0, vx: 0, r: 12 };
  let embers = [], particles = [], trail = [], dust = [];
  let emberTimer = 0.8, emberCount = 0;
  let best = 0, lastScore = -1, lastBest = -1, lastSub = "";
  let shake = 0, cooldown = 0;
  let pointerDown = false, pointerX = null;
  const keys = new Set();

  try {
    best = parseInt(localStorage.getItem("irongorge.best") || "0", 10) || 0;
  } catch (e) {
    best = 0;
  }

  let actx = null, master = null, muted = false;

  function initAudio() {
    if (actx) {
      if (actx.state === "suspended") actx.resume();
      return;
    }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = muted ? 0 : 0.6;
    master.connect(actx.destination);

    const droneGain = actx.createGain();
    droneGain.gain.value = 0.045;
    const filter = actx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 340;
    const a = actx.createOscillator();
    a.type = "sawtooth";
    a.frequency.value = 55;
    const b = actx.createOscillator();
    b.type = "sine";
    b.frequency.value = 82.5;
    a.connect(filter);
    b.connect(filter);
    filter.connect(droneGain);
    droneGain.connect(master);
    a.start();
    b.start();

    const lfo = actx.createOscillator();
    lfo.frequency.value = 0.06;
    const lfoGain = actx.createGain();
    lfoGain.gain.value = 130;
    lfo.connect(lfoGain);
    lfoGain.connect(filter.frequency);
    lfo.start();
  }

  function blip(level) {
    if (!actx) return;
    const now = actx.currentTime;
    const n = Math.min(level, 18);
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(480 + n * 48, now);
    o.frequency.exponentialRampToValueAtTime(900 + n * 70, now + 0.09);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(0.16, now + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, now + 0.19);
    o.connect(g);
    g.connect(master);
    o.start(now);
    o.stop(now + 0.21);
  }

  function crash() {
    if (!actx) return;
    const now = actx.currentTime;
    const len = Math.floor(actx.sampleRate * 0.6);
    const buf = actx.createBuffer(1, len, actx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) {
      const f = 1 - i / len;
      data[i] = (Math.random() * 2 - 1) * f * f;
    }
    const src = actx.createBufferSource();
    src.buffer = buf;
    const f = actx.createBiquadFilter();
    f.type = "lowpass";
    f.frequency.setValueAtTime(1000, now);
    f.frequency.exponentialRampToValueAtTime(90, now + 0.55);
    const g = actx.createGain();
    g.gain.value = 0.45;
    src.connect(f);
    f.connect(g);
    g.connect(master);
    src.start(now);

    const o = actx.createOscillator();
    const og = actx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(130, now);
    o.frequency.exponentialRampToValueAtTime(34, now + 0.55);
    og.gain.setValueAtTime(0.4, now);
    og.gain.exponentialRampToValueAtTime(0.001, now + 0.62);
    o.connect(og);
    og.connect(master);
    o.start(now);
    o.stop(now + 0.65);
  }

  function toggleMute() {
    muted = !muted;
    muteBtn.classList.toggle("off", muted);
    muteBtn.setAttribute("aria-pressed", String(muted));
    if (master && actx) {
      master.gain.setTargetAtTime(muted ? 0 : 0.6, actx.currentTime, 0.02);
    }
  }

  function resize() {
    DPR = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    unit = Math.min(W, 820);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    bgGrad = ctx.createLinearGradient(0, 0, 0, H);
    bgGrad.addColorStop(0, "#0a1119");
    bgGrad.addColorStop(0.5, "#090a0f");
    bgGrad.addColorStop(1, "#1a0e08");

    wallGrad = ctx.createLinearGradient(0, 0, 0, H);
    wallGrad.addColorStop(0, "#040407");
    wallGrad.addColorStop(0.55, "#070609");
    wallGrad.addColorStop(1, "#120b08");

    player.r = Math.max(6, Math.min(14, Math.min(W, H) * 0.018));
    if (!dust.length) initDust();

    if (state === "playing") {
      const w = scroll + H - player.y;
      const c = gapCenter(w), h = gapHalf(w);
      player.x = clamp(player.x, c - h + player.r, c + h - player.r);
    }
  }

  function initDust() {
    dust = [];
    const count = Math.round(Math.min(110, Math.max(50, (W * H) / 16000)));
    for (let i = 0; i < count; i++) {
      dust.push({
        x: Math.random() * W,
        y: Math.random() * H,
        z: 0.18 + Math.random() * 0.82,
        s: 0.5 + Math.random() * 1.7,
        ph: Math.random() * 6.283,
        cool: Math.random() < 0.18
      });
    }
  }

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function gapCenter(w) {
    const s = w * 0.001;
    return (
      W * 0.5 +
      Math.sin(s + 0.4) * W * 0.15 +
      Math.sin(s * 2.37 + 2.1) * W * 0.055 +
      Math.sin(s * 0.53 + 4.0) * W * 0.1
    );
  }

  function gapHalf(w) {
    const d = Math.min(1, w / 22000);
    const base = unit * (0.19 - 0.1 * d);
    const pulse = 1 + 0.09 * Math.sin(w * 0.0031 + 1.3);
    return Math.max(unit * 0.07, base * pulse);
  }

  function meters() {
    return Math.floor(scroll / 40);
  }

  function score() {
    return meters() + emberCount * 7;
  }

  function spawnEmber() {
    const w = scroll + H + 60;
    const c = gapCenter(w), h = gapHalf(w);
    embers.push({
      x: clamp(c + (Math.random() * 2 - 1) * h * 0.65, 16, W - 16),
      w,
      phase: Math.random() * 6.283,
      sway: 0.5 + Math.random()
    });
  }

  function burst(x, y, n, color) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.283;
      const sp = 40 + Math.random() * 260;
      const life = 0.28 + Math.random() * 0.7;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life,
        max: life,
        size: 1 + Math.random() * 2.2,
        color
      });
    }
  }

  function updateHud(force) {
    const s = score();
    if (force || s !== lastScore) {
      depthEl.textContent = s;
      lastScore = s;
    }
    if (force || best !== lastBest) {
      bestEl.textContent = best;
      lastBest = best;
    }
    const sub = meters() + " m · " + emberCount + " ember" + (emberCount === 1 ? "" : "s");
    if (force || sub !== lastSub) {
      subEl.textContent = sub;
      lastSub = sub;
    }
  }

  function begin() {
    if (state === "playing") return;
    if (state === "dead" && cooldown > 0) return;
    initAudio();
    state = "playing";
    scroll = 0;
    speed = 150;
    emberCount = 0;
    embers.length = 0;
    particles.length = 0;
    trail.length = 0;
    emberTimer = 0.55;
    shake = 0;
    player.vx = 0;
    player.y = H * 0.72;
    player.x = gapCenter(scroll + H - player.y);
    cooldown = 0;
    overlay.classList.add("hidden");
    updateHud(true);
  }

  function die() {
    if (state !== "playing") return;
    state = "dead";
    cooldown = 0.4;
    shake = reduceMotion ? 0 : 18;
    burst(player.x, player.y, 44, "#ff9a4d");
    burst(player.x, player.y, 16, "#ffe6b0");
    trail.length = 0;
    crash();

    const s = score();
    if (s > best) {
      best = s;
      try {
        localStorage.setItem("irongorge.best", String(best));
      } catch (e) {}
    }
    updateHud(true);
    finalScoreEl.textContent = s;
    finalBestEl.textContent = best;
    runLineEl.innerHTML =
      meters() + " m &middot; " + emberCount + " ember" + (emberCount === 1 ? "" : "s");
    menuCard.hidden = true;
    overCard.hidden = false;
    overlay.classList.remove("hidden");
  }

  function updatePlayer(dt) {
    const max = Math.max(520, Math.min(900, W * 0.9));
    let target = null;

    if (pointerDown && pointerX !== null) {
      target = clamp((pointerX - player.x) * 10, -max, max);
    } else {
      let dir = 0;
      if (keys.has("arrowleft") || keys.has("a")) dir--;
      if (keys.has("arrowright") || keys.has("d")) dir++;
      if (dir !== 0) target = dir * max;
    }

    if (target === null) {
      player.vx *= Math.pow(0.0002, dt);
    } else {
      const k = 1 - Math.pow(0.00005, dt);
      player.vx += (target - player.vx) * k;
    }

    player.x += player.vx * dt;
    player.x = clamp(player.x, player.r, W - player.r);

    trail.push({ x: player.x, y: player.y });
    if (trail.length > 18) trail.shift();
  }

  function updateEmbers(dt) {
    for (let i = embers.length - 1; i >= 0; i--) {
      const e = embers[i];
      const y = H - (e.w - scroll);
      if (y > H + 70) {
        embers.splice(i, 1);
        continue;
      }
      e.x += Math.sin(t * 2.2 + e.phase) * 7 * dt * e.sway;
      e.x = clamp(e.x, 14, W - 14);

      if (state !== "playing") continue;

      const dx = e.x - player.x;
      const dy = y - player.y;
      const d2 = dx * dx + dy * dy;
      if (d2 < 115 * 115) {
        e.x -= dx * Math.min(1, dt * 7) * 0.7;
        const mx = e.x - player.x;
        const my = y - player.y;
        const rr = player.r + 16;
        if (mx * mx + my * my < rr * rr) {
          burst(e.x, y, 9, "#ffd27a");
          emberCount++;
          blip(emberCount);
          embers.splice(i, 1);
        }
      }
    }
  }

  function updateParticles(dt) {
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt;
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= Math.exp(-1.6 * dt);
      p.vy *= Math.exp(-1.6 * dt);
      p.vy += 40 * dt;
    }
  }

  function updateDust(dt) {
    const v = state === "playing" ? speed : state === "menu" ? 55 : 12;
    for (const p of dust) {
      p.y += (v * 0.45 * p.z + 8 * p.z) * dt;
      p.x += Math.sin(t * 0.6 + p.ph) * 6 * dt;
      if (p.y > H + 4) {
        p.y = -4;
        p.x = Math.random() * W;
      }
    }
  }

  function update(dt) {
    t += dt;
    cooldown = Math.max(0, cooldown - dt);
    shake *= Math.exp(-7 * dt);
    if (shake < 0.25) shake = 0;

    if (state === "playing") {
      player.y = H * 0.72;
      speed = 150 + Math.min(310, scroll * 0.014);
      scroll += speed * dt;
      updatePlayer(dt);

      const w = scroll + H - player.y;
      const c = gapCenter(w), h = gapHalf(w);
      if (Math.abs(player.x - c) > h - player.r * 0.45) {
        die();
      } else {
        emberTimer -= dt;
        if (emberTimer <= 0) {
          emberTimer = 0.45 + Math.random() * 0.5;
          spawnEmber();
        }
      }
    } else if (state === "menu") {
      player.y = H * 0.6 + Math.sin(t * 1.1) * 8;
      const mw = scroll + H - player.y;
      const mc = gapCenter(mw), mh = gapHalf(mw);
      player.x = mc + Math.sin(t * 0.6) * Math.min(mh * 0.4, W * 0.06);
      player.vx = 0;
      speed = 55;
      scroll = Math.min(scroll + speed * dt, 6500);
      trail.push({ x: player.x, y: player.y });
      if (trail.length > 18) trail.shift();
      emberTimer -= dt;
      if (emberTimer <= 0) {
        emberTimer = 1.1 + Math.random();
        spawnEmber();
      }
    }

    updateEmbers(dt);
    updateParticles(dt);
    updateDust(dt);
    if (state === "playing" || state === "dead") updateHud(false);
  }

  function radial(x, y, r, color) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, r);
    g.addColorStop(0, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - r, y - r, r * 2, r * 2);
  }

  function drawBackground() {
    ctx.fillStyle = bgGrad;
    ctx.fillRect(-40, -40, W + 80, H + 80);

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    radial(
      W * 0.5 + Math.sin(t * 0.13) * W * 0.04,
      H * 1.08,
      Math.max(W, H) * 0.55,
      "rgba(255,105,35,0.13)"
    );
    radial(
      W * 0.12 + Math.sin(t * 0.21) * 22,
      H * 0.16,
      Math.max(W, H) * 0.36,
      "rgba(70,180,220,0.055)"
    );
    ctx.restore();
  }

  function drawDust() {
    for (const p of dust) {
      const a = 0.07 + p.z * 0.25;
      ctx.fillStyle = p.cool
        ? "rgba(130,220,235," + a * 0.8 + ")"
        : "rgba(255,214,160," + a + ")";
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.s, 0, 6.283);
      ctx.fill();
    }
  }

  function drawGorge() {
    const step = 10;
    const pts = [];
    for (let y = -step; y <= H + step; y += step) {
      const w = scroll + (H - y);
      pts.push({ y, c: gapCenter(w), h: gapHalf(w) });
    }
    const lastI = pts.length - 1;

    ctx.beginPath();
    ctx.moveTo(-6, pts[0].y);
    for (const p of pts) ctx.lineTo(p.c - p.h, p.y);
    ctx.lineTo(-6, pts[lastI].y);
    ctx.closePath();
    ctx.moveTo(W + 6, pts[0].y);
    for (const p of pts) ctx.lineTo(p.c + p.h, p.y);
    ctx.lineTo(W + 6, pts[lastI].y);
    ctx.closePath();
    ctx.fillStyle = wallGrad;
    ctx.fill();

    ctx.save();
    ctx.clip();
    const band = 110;
    const startW = Math.ceil(scroll / band) * band;
    ctx.strokeStyle = "rgba(255,170,110,0.05)";
    ctx.lineWidth = 1;
    for (let wy = startW; wy < scroll + H + band; wy += band) {
      const y = H - (wy - scroll);
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    ctx.restore();

    const rim = ctx.createLinearGradient(0, 0, 0, H);
    rim.addColorStop(0, "rgba(255,159,84,0.95)");
    rim.addColorStop(0.45, "rgba(255,214,140,1)");
    rim.addColorStop(1, "rgba(255,106,45,0.95)");

    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.lineJoin = "round";
    ctx.lineCap = "round";
    ctx.strokeStyle = rim;
    ctx.shadowColor = "rgba(255,120,50,0.85)";
    ctx.shadowBlur = 24;

    const edge = (sign) => {
      ctx.beginPath();
      ctx.moveTo(pts[0].c + sign * pts[0].h, pts[0].y);
      for (const p of pts) ctx.lineTo(p.c + sign * p.h, p.y);
    };

    ctx.lineWidth = 9;
    ctx.globalAlpha = 0.1;
    for (const s of [-1, 1]) { edge(s); ctx.stroke(); }
    ctx.lineWidth = 3;
    ctx.globalAlpha = 0.42;
    for (const s of [-1, 1]) { edge(s); ctx.stroke(); }
    ctx.lineWidth = 1.2;
    ctx.globalAlpha = 1;
    for (const s of [-1, 1]) { edge(s); ctx.stroke(); }
    ctx.restore();
  }

  function drawEmbers() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const e of embers) {
      const y = H - (e.w - scroll);
      if (y < -40 || y > H + 40) continue;
      const pulse = 0.82 + 0.18 * Math.sin(t * 4 + e.phase);
      ctx.save();
      ctx.translate(e.x, y);
      ctx.rotate(t * 1.2 + e.phase);
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 17 * pulse);
      g.addColorStop(0, "rgba(255,228,160,0.85)");
      g.addColorStop(1, "rgba(255,150,60,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(0, 0, 17 * pulse, 0, 6.283);
      ctx.fill();
      ctx.fillStyle = "#ffe6b0";
      const s = 4.6 * pulse;
      ctx.beginPath();
      ctx.moveTo(0, -s);
      ctx.lineTo(s, 0);
      ctx.lineTo(0, s);
      ctx.lineTo(-s, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    ctx.restore();
  }

  function drawPlayer() {
    const px = player.x, py = player.y;

    ctx.save();
    ctx.globalCompositeOperation = "lighter";

    for (let i = 0; i < trail.length; i++) {
      const p = trail[i];
      const a = (i + 1) / trail.length;
      const rr = player.r * (0.3 + 0.9 * a) * 2.4;
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
      g.addColorStop(0, "rgba(255,172,92," + 0.16 * a + ")");
      g.addColorStop(1, "rgba(255,120,40,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(p.x, p.y, rr, 0, 6.283);
      ctx.fill();
    }

    const halo = ctx.createRadialGradient(px, py, 0, px, py, player.r * 4);
    halo.addColorStop(0, "rgba(255,244,210,0.95)");
    halo.addColorStop(0.26, "rgba(255,176,88,0.55)");
    halo.addColorStop(1, "rgba(255,110,40,0)");
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(px, py, player.r * 4, 0, 6.283);
    ctx.fill();

    ctx.fillStyle = "#fff7e8";
    ctx.beginPath();
    ctx.arc(px, py, player.r * 0.8, 0, 6.283);
    ctx.fill();

    ctx.strokeStyle = "rgba(255,214,148,0.85)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(px, py, player.r * 1.45, t * 2.2, t * 2.2 + 2.1);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(px, py, player.r * 1.45, -t * 1.7 + 3.3, -t * 1.7 + 4.9);
    ctx.stroke();

    ctx.restore();
  }

  function drawParticles() {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (const p of particles) {
      const a = Math.max(0, p.life / p.max);
      ctx.globalAlpha = a;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.4 + a), 0, 6.283);
      ctx.fill();
    }
    ctx.restore();
  }

  function render() {
    ctx.fillStyle = "#08090c";
    ctx.fillRect(0, 0, W, H);

    ctx.save();
    if (shake > 0) {
      ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
    }
    drawBackground();
    drawDust();
    drawGorge();
    drawEmbers();
    if (state !== "dead") drawPlayer();
    drawParticles();
    ctx.restore();
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }

  addEventListener("resize", resize);
  addEventListener("keydown", (e) => {
    const k = e.key.toLowerCase();
    if ([" ", "arrowleft", "arrowright", "arrowup", "arrowdown"].includes(k)) {
      e.preventDefault();
    }
    keys.add(k);
    if (k === " " || k === "enter") {
      if (state === "menu" || state === "dead") begin();
    }
    if (k === "m") toggleMute();
  });
  addEventListener("keyup", (e) => {
    keys.delete(e.key.toLowerCase());
  });
  addEventListener("blur", () => {
    keys.clear();
    pointerDown = false;
  });

  canvas.addEventListener("pointerdown", (e) => {
    pointerDown = true;
    pointerX = e.clientX;
    if (state === "menu" || state === "dead") begin();
  });
  canvas.addEventListener("pointermove", (e) => {
    if (pointerDown) pointerX = e.clientX;
  });
  addEventListener("pointerup", () => { pointerDown = false; });
  addEventListener("pointercancel", () => { pointerDown = false; });

  document.getElementById("startBtn").addEventListener("click", begin);
  document.getElementById("restartBtn").addEventListener("click", begin);
  muteBtn.addEventListener("click", toggleMute);

  resize();
  player.x = W / 2;
  player.y = H * 0.6;
  updateHud(true);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
